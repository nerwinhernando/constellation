default: &default
  adapter: postgresql
  encoding: unicode
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>

development:
  <<: *default
  database: constellation_development

test:
  <<: *default
  database: constellation_test

production:
  primary: &primary_production
    <<: *default
    database: constellation_production
    username: constellation
    password: <%= ENV["CONSTELLATION_DATABASE_PASSWORD"] %>
  cache:
    <<: *primary_production
    database: constellation_production_cache
    migrations_paths: db/cache_migrate
  queue:
    <<: *primary_production
    database: constellation_production_queue
    migrations_paths: db/queue_migrate
  cable:
    <<: *primary_production
    database: constellation_production_cable
    migrations_paths: db/cable_migrate
